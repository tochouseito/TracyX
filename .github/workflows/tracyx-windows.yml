name: TracyX Windows

on:
  push:
    branches:
      - master
      - codex/m0-m1-integrated-profiler
      - codex/issue-12-presentmon-metrics
      - codex/issue-13-pix-capture
      - codex/issue-14-coexistence
      - codex/issue-15-diagnostics
      - codex/issue-16-memory
      - codex/issue-17-comparison
      - codex/issue-18-advanced-lanes
      - codex/issue-19-stability
      - codex/issue-20-agent-recovery
      - codex/issue-21-windows-package
      - codex/issue-22-regression
  pull_request:
    branches:
      - master
      - codex/m0-m1-integrated-profiler
      - codex/issue-12-presentmon-metrics
      - codex/issue-13-pix-capture
      - codex/issue-14-coexistence
      - codex/issue-15-diagnostics
      - codex/issue-16-memory
      - codex/issue-17-comparison
      - codex/issue-18-advanced-lanes
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tracyx-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
      - name: Configure Core
        run: cmake -S tracyx -B build/tracyx-core-ci -G "Visual Studio 18 2026" -A x64 -DTRACYX_BUILD_PROBES=OFF
      - name: Build Core tests
        run: cmake --build build/tracyx-core-ci --config Debug --target TracyXCoreTests --parallel 2
      - name: Run Core tests
        run: ctest --test-dir build/tracyx-core-ci -C Debug --output-on-failure

  agent-and-viewer:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build pinned DxTimingCaptureLibrary
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'DxTimingCaptureLibrary'
          git clone https://github.com/microsoft/DxTimingCaptureLibrary.git $root
          git -C $root checkout 72bd2b18553493aa9850e434caf71bfa18952aac
          msbuild (Join-Path $root 'DxTimingCaptureLibrary.sln') /restore /p:Configuration=Debug /p:Platform=x64 /m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $library = Join-Path $root 'x64/Debug/lib/DxTimingCaptureLibrary.lib'
          if (-not (Test-Path -LiteralPath $library)) { throw "DxTimingCaptureLibrary.lib was not found at $library" }
          $target = Join-Path $root 'lib/x64/Debug/lib'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item -LiteralPath $library -Destination $target
          "TRACYX_DX_TIMING_ROOT=$root" >> $env:GITHUB_ENV
      - name: Extract pinned PresentMon SDK
        if: ${{ hashFiles('tracyx/agent/PresentMonAdapter.cpp') != '' }}
        shell: pwsh
        run: |
          $msi = Join-Path $env:RUNNER_TEMP 'PresentMon-2.6.0.msi'
          $root = Join-Path $env:RUNNER_TEMP 'PresentMonSDK'
          Invoke-WebRequest 'https://github.com/GameTechDev/PresentMon/releases/download/v2.6.0/PresentMon-2.6.0.msi' -OutFile $msi
          $installer = Start-Process -FilePath msiexec.exe -ArgumentList @('/a', "`"$msi`"", '/qn', "TARGETDIR=`"$root`"") -Wait -PassThru -WindowStyle Hidden
          if ($installer.ExitCode -ne 0) { throw "PresentMon MSI extraction failed: $($installer.ExitCode)" }
          $header = Get-ChildItem -LiteralPath $root -Recurse -Filter PresentMonAPI.h | Select-Object -First 1
          if (-not $header) { throw 'PresentMonAPI.h was not found in the extracted MSI' }
          $sdk = $header.DirectoryName
          foreach ($name in @('PresentMonAPI2Loader.lib', 'PresentMonAPI2Loader.dll')) {
            if (-not (Test-Path -LiteralPath (Join-Path $sdk $name))) { throw "$name was not found in $sdk" }
          }
          "TRACYX_PRESENTMON_SDK_ROOT=$sdk" >> $env:GITHUB_ENV
          $license = Join-Path $env:RUNNER_TEMP 'PresentMon-2.6.0-LICENSE.txt'
          Invoke-WebRequest 'https://raw.githubusercontent.com/GameTechDev/PresentMon/v2.6.0/LICENSE.txt' -OutFile $license
          "TRACYX_PRESENTMON_LICENSE=$license" >> $env:GITHUB_ENV
      - name: Configure Agent and probes
        shell: pwsh
        run: |
          $pixRoot = Join-Path $env:RUNNER_TEMP 'WinPixEventRuntime.1.0.240308001'
          $package = Join-Path $env:RUNNER_TEMP 'WinPixEventRuntime.1.0.240308001.zip'
          Invoke-WebRequest 'https://www.nuget.org/api/v2/package/WinPixEventRuntime/1.0.240308001' -OutFile $package
          Expand-Archive -LiteralPath $package -DestinationPath $pixRoot
          if (-not (Test-Path -LiteralPath (Join-Path $pixRoot 'Include/WinPixEventRuntime/pix3.h'))) { throw 'WinPixEventRuntime headers were not restored' }
          $args = @('-S', 'tracyx', '-B', 'build/tracyx-ci', '-G', 'Visual Studio 18 2026', '-A', 'x64', "-DTRACYX_DX_TIMING_ROOT=$env:TRACYX_DX_TIMING_ROOT")
          if ($env:TRACYX_PRESENTMON_SDK_ROOT) { $args += "-DTRACYX_PRESENTMON_SDK_ROOT=$env:TRACYX_PRESENTMON_SDK_ROOT" }
          $args += "-DTRACYX_WINPIX_ROOT=$pixRoot"
          & cmake @args
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Agent and probes
        run: cmake --build build/tracyx-ci --config Debug --parallel 2
      - name: Configure Viewer
        run: cmake -S profiler -B build/profiler-ci -G "Visual Studio 18 2026" -A x64
      - name: Build Viewer
        run: cmake --build build/profiler-ci --config Debug --target tracy-profiler --parallel 2
      - name: Configure and build Capture
        run: |
          cmake -S capture -B build/capture-ci -G "Visual Studio 18 2026" -A x64
          cmake --build build/capture-ci --config Debug --target tracy-capture --parallel 2
      - name: Package Windows Debug preview
        shell: pwsh
        run: |
          $pixRoot = Join-Path $env:RUNNER_TEMP 'WinPixEventRuntime.1.0.240308001'
          pwsh -NoProfile -File tracyx/scripts/package_windows.ps1 -Configuration Debug `
            -AgentBuildDir build/tracyx-ci -ViewerBuildDir build/profiler-ci -CaptureBuildDir build/capture-ci `
            -DxTimingRoot $env:TRACYX_DX_TIMING_ROOT -VendorCache build/profiler-ci/.cpm-cache `
            -WinPixRoot $pixRoot -PresentMonLicense $env:TRACYX_PRESENTMON_LICENSE -OutputDirectory build/dist-ci
      - uses: actions/upload-artifact@v4
        with:
          name: TracyX-windows-x64-debug-preview
          path: build/dist-ci/*.zip
